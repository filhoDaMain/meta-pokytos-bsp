# Major todo: use linux-stable kernel

require conf/machine/qemuarm.conf

# Use the same overrides as qemuarm machine
MACHINEOVERRIDES:append = ":qemuarm"

KERNEL_DTB_FILE = "qemu_raspi3ap.dtb"
KERNEL_IMAGETYPE = "zImage"
BOOT_SCRIPT_FILE = "boot.scr"

UBOOT_ENTRYPOINT =       "0x00008000"
UBOOT_LOADADDRESS =      "0x00008000"
KERNEL_EXTRA_ARGS += "LOADADDR=${UBOOT_ENTRYPOINT}"

IMAGE_FSTYPES:append = " wic.qcow2"
WKS_FILE = "qemu-test.wks"
IMAGE_BOOT_FILES = "${KERNEL_IMAGETYPE} ${KERNEL_DTB_FILE} ${BOOT_SCRIPT_FILE}"

do_image_wic[depends] += " \
    u-boot:do_deploy \
    qemu-devicetree:do_deploy \
"

QB_ROOTFS_OPT = "\
    -drive id=disk0,file=@ROOTFS@,if=none,format=qcow2 \
    -device virtio-blk-device,drive=disk0 \
"

QB_OPT_APPEND = "-bios ${DEPLOY_DIR_IMAGE}/u-boot.bin"

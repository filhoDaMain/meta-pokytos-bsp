#@TYPE: Machine
#@NAME: QEMU ARMv8 machine
#@DESCRIPTION: Machine configuration for running an ARMv8 system on QEMU

require conf/machine/include/arm/armv8a/tune-cortexa53.inc
require conf/machine/include/qemu.inc

KERNEL_IMAGETYPE = "Image"

UBOOT_MACHINE ?= "qemu_arm64_defconfig"

SERIAL_CONSOLES ?= "115200;ttyAMA0 115200;hvc0"

# For runqemu
QB_SYSTEM_NAME = "qemu-system-aarch64"

# Generic arm64 emulation
QB_MACHINE = "-machine virt"
QB_CPU = "-cpu cortex-a53"
QB_SMP ?= "-smp 4"
QB_CPU_KVM = "-cpu host -machine gic-version=3"

QB_ROOTFS_OPT = "\
    -drive if=none,file=@ROOTFS@,format=raw,id=mmc0 \
    -device virtio-blk-device,drive=mmc0 \
"

# Virtio serial console
QB_SERIAL_OPT = "-device virtio-serial-pci -chardev null,id=virtcon -device virtconsole,chardev=virtcon"
QB_TCPSERIAL_OPT = "-device virtio-serial-pci -chardev socket,id=virtcon,port=@PORT@,host=127.0.0.1,nodelay=on -device virtconsole,chardev=virtcon"


MACHINEOVERRIDES:prepend = "orange-pi-zero2:"
KERNEL_DEVICETREE = "allwinner/sun50i-h618-orangepi-zero3.dtb"

PREFERRED_PROVIDER_virtual/kernel = "linux-stable"

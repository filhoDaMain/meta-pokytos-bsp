require include/opizero3.inc

UBOOT_MACHINE = "qemu_arm64_defconfig"
IMAGE_FSTYPES = "tar.bz2 ext4"


# QEMU
IMAGE_CLASSES += "qemuboot"
QB_SYSTEM_NAME = "qemu-system-aarch64"

# Generic arm64 emulation
QB_MACHINE = "-machine virt"
QB_CPU = "-cpu cortex-a53"
QB_SMP ?= "-smp 4"
QB_MEM = "-m 1024"
QB_CPU_KVM = "-cpu host -machine gic-version=3"

QB_ROOTFS_OPT = "\
    -drive if=none,file=@ROOTFS@,format=raw,id=mmc0 \
    -device virtio-blk-device,drive=mmc0 \
"

# Network
GDB_PORT_FWD = "tcp::1234-:1234"

QB_NETWORK_DEVICE = "\
    -device virtio-net-device,netdev=eth0,mac=@MAC@ \
"
QB_SLIRP_OPT = "\
    -netdev user,id=eth0,hostfwd=tcp::2222-:22,hostfwd=${GDB_PORT_FWD} \
"

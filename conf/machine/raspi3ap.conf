require include/raspi3ap.inc

KERNEL_DEVICETREE = "broadcom/bcm2837-rpi-3-a-plus.dtb"
UBOOT_MACHINE = "rpi_3_32b_config"
SDIMG_KERNELIMAGE ?= "kernel7.img"
ENABLE_UART = "1"
SERIAL_CONSOLES ?= "115200;ttyS0"
ARMSTUB ?= "armstub7.bin"
RPI_USE_U_BOOT = "1"

IMAGE_BOOT_FILES = "\
    ${BOOTFILES_DIR_NAME}/* \
    bcm2837-rpi-3-a-plus.dtb \
    ${RPI_EXTRA_IMAGE_BOOT_FILES} \
"


# Note:
# Wi-Fi and Bluetooth drivers depend on firmware blobs provided by
# packagegroup-raspi3ap-firmware.
# These blobs need to be available once the drivers are probed, otherwise
# the driver initialization fails.
#
# This boot dependency is fulfilled in 2 possible ways:
# - Wi-Fi and Bluetooth drivers are compiled as loadable modules, so that
#   when they are probed the rootfs is already mounted and therefore the
#   firmware blobs are available to be loaded;
# - The drivers are compiled as builtin drivers but the firmware blobs need
#   to be part of initramfs.
WIFI_MODULES = "\
    kernel-module-brcmfmac-wcc \
    kernel-module-brcmfmac \
    kernel-module-brcmutil \
"
BT_MODULES = "\
    kernel-module-hci-uart \
    kernel-module-btbcm \
"


MACHINE_EXTRA_RDEPENDS += "\
    packagegroup-raspi3ap-firmware \
    ${WIFI_MODULES} \
    ${BT_MODULES} \
"

MACHINE_EXTRA_RRECOMMENDS = "\
    kernel-module-display7 \
"
